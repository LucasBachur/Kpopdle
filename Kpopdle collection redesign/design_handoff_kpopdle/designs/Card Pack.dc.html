<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  @keyframes pkCut {
    0% { width: 0%; opacity: 0; }
    25% { opacity: 1; }
    100% { width: 100%; opacity: 1; }
  }
  @keyframes pkPeel {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-280px) rotate(-8deg); opacity: 0; }
  }
  @keyframes pkGapReveal {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }
</style>
</helmet>

<div style="min-height:100vh; background:linear-gradient(165deg, oklch(0.87 0.058 300), oklch(0.85 0.058 300)); font-family:'Plus Jakarta Sans',sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:40px;">

  <div style="text-align:center;">
    <div style="font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.16em; color:#5a4d70; margin-bottom:6px;">SUMMON SEQUENCE · WIP</div>
    <div style="font-size:22px; font-weight:800; color:#2a2138;">Card Pack Design</div>
  </div>

  <sc-if value="{{ showPack }}" hint-placeholder-val="{{ true }}">
    <div style="position:relative; width:220px; height:300px;">

      <!-- pack body (starts at the cut line — nothing above it) -->
      <div style="position:absolute; top:22px; left:0; right:0; bottom:0; border-radius:0 0 6px 6px; overflow:hidden; background:linear-gradient(135deg,#d3d6db,#a8adb6); box-shadow:0 26px 50px rgba(20,10,40,.35); border-left:1px solid rgba(255,255,255,.55); border-right:1px solid rgba(255,255,255,.55);">
        <div style="position:absolute; inset:-30px; background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.35) 0 3px, transparent 3px 22px); background-position:0 -22px; mix-blend-mode:overlay; opacity:.8;"></div>
        <div style="position:absolute; inset:0; box-shadow:inset 0 2px 3px rgba(255,255,255,.7);"></div>
      </div>

      <!-- bottom crimp: SVG path (fill) + polyline (true stroke along the zigzag only) -->
      <svg style="position:absolute; left:2px; right:2px; bottom:-8px; width:calc(100% - 4px); height:12px;" viewBox="0 0 216 12" preserveAspectRatio="none">
        <path d="{{ zzPathD }}" fill="#b7bbc4"></path>
        <polyline points="{{ zzPoints }}" fill="none" stroke="#fff" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"></polyline>
      </svg>

      <!-- top flap (flies up and away) -->
      <div style="position:absolute; top:0; left:0; right:0; height:26px; overflow:visible; animation:pkPeel .7s cubic-bezier(.5,0,.4,1) {{ peelDelay }} forwards;">
        <div style="position:absolute; inset:0; border-radius:6px 6px 0 0; overflow:hidden; background:linear-gradient(135deg,#d3d6db,#a8adb6); border-left:1px solid rgba(255,255,255,.55); border-right:1px solid rgba(255,255,255,.55);">
          <div style="position:absolute; inset:-30px; background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.35) 0 3px, transparent 3px 22px); mix-blend-mode:overlay; opacity:.8;"></div>
        </div>
        <!-- top crimp: same SVG, flipped -->
        <svg style="position:absolute; left:2px; right:2px; top:-8px; width:calc(100% - 4px); height:12px; transform:scaleY(-1);" viewBox="0 0 216 12" preserveAspectRatio="none">
          <path d="{{ zzPathD }}" fill="#c7cad0"></path>
          <polyline points="{{ zzPoints }}" fill="none" stroke="#fff" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"></polyline>
        </svg>
      </div>

      <!-- cut line sweeping right to left -->
      <div style="position:absolute; top:22px; right:0; height:3px; border-radius:2px; background:#0a0510; box-shadow:0 0 6px rgba(0,0,0,.6); animation:pkCut .7s cubic-bezier(.4,0,.2,1) forwards;"></div>
    </div>
  </sc-if>

  <div onClick="{{ onReplay }}" style="padding:11px 22px; border-radius:11px; background:#1b1622; color:#f5c43d; font-weight:800; font-size:13px; cursor:pointer;">Replay</div>

  <div style="max-width:420px; text-align:center; font-size:12px; color:#5a4d70; line-height:1.6;">Metallic platinum pack — cut line sweeps right→left, then the top flap peels back to reveal the opening. Card slide-out comes next.</div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { showPack: true };

  replay() {
    this.setState({ showPack: false });
    setTimeout(() => this.setState({ showPack: true }), 60);
  }

  zigzagPoints(count, w, h) {
    const step = w / count;
    const pts = ['0,0'];
    for (let i = 0; i < count; i++) {
      const xMid = i * step + step / 2;
      const xEnd = (i + 1) * step;
      pts.push(`${xMid.toFixed(2)},${h}`, `${xEnd.toFixed(2)},0`);
    }
    return pts.join(' ');
  }

  zigzagPathD(count, w, h) {
    const step = w / count;
    let d = 'M0,0';
    for (let i = 0; i < count; i++) {
      const xMid = i * step + step / 2;
      const xEnd = (i + 1) * step;
      d += ` L${xMid.toFixed(2)},${h} L${xEnd.toFixed(2)},0`;
    }
    return d + ' Z';
  }

  renderVals() {
    return {
      showPack: this.state.showPack,
      gapDelay: '550ms',
      peelDelay: '650ms',
      onReplay: () => this.replay(),
      zzPoints: this.zigzagPoints(15, 216, 12),
      zzPathD: this.zigzagPathD(15, 216, 12),
    };
  }
}

</script>
</body>
</html>
